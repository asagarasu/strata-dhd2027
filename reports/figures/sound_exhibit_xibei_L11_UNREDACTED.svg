<text x="20" y="30" font-size="17" font-weight="bold">「西北有高樓」第十一行 一彈再三嘆 — the pluck-and-sigh's sound, per seat: word · device · graph</text>
<text x="20" y="50" font-size="11" fill="#555">the source carries sound latent in the graph 彈 (amber; HowNet single-char inventory, 3-check✓) with the descriptive word tier silent; three translators STATE it at this line (word-tier, red) — birrell/watson sigh · xu refrain — owen fires the DEVICE only (allit:strummed-sighed, green; word-tier silent), waley silent. 嘆 itself is non-word-tier (rad 30, 廣韻 長息); the seats' sigh fires via the WordNet closure. All receipts committed, post-rerun (registration 0726).</text>
