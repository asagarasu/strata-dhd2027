<text x="20" y="418" font-size="10" fill="#777">notes: crossing is word-tier ONLY (birrell/watson sigh, xu refrain). owen fires the DEVICE only (allit:strummed-sighed) → not a word-tier crossing; both surface words are verbs and fall through the noun-closure gap. waley silent — sobs reads as sound to a reader but sits outside the WordNet auditory closure the labeler uses. Booleans carry the evidence; scalar shown honestly.</text>
<text x="20" y="434" font-size="10" fill="#777">poem-grain caveat: this line-grain latent→stated crossing sits INSIDE a poem-grain SURVIVAL verdict (transitions, all five seats). The source STATES sound elsewhere in the poem — L5 上有弦歌聲 → 歌[釋樂] fires=true — so the whole-poem sound field survives; the exhibit's claim is the line-grain crossing at L11 itself, not the poem verdict.</text>
<text x="20" y="450" font-size="10" fill="#777">sources: descriptive/latent xibei _56 jsons (post-rerun, registration 0726). derivation-lookup 弹: word-tier legs 釋樂∪音部∪廣韻 ∩ line-chars = ∅ (all three False → source word-tier silent); written carrier {char:弹} @ hownet_single_char_inventory[sound], fires_three_check=true (latent written_row idx10). 嘆(叹) non-word-tier: rad 30, 廣韻 長息 — the sigh fires from the WordNet closure, not from 嘆.</text>
