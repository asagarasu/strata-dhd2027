<text x="20" y="418" font-size="10" fill="#777">notes: the two descriptive tracks are independent — the WORD tier states sound (mention), the DEVICE tier enacts it (叠字/rep/allit). At THIS line the crossing is word-tier ONLY: no device co-fires in any seat (sound_device.fires=false throughout). Scalar shown honestly (waley reads cool at -0.05 yet states the mention); booleans carry the evidence. Sound-referent: not per-line-instrumented on this board.</text>
<text x="20" y="434" font-size="10" fill="#777">poem-grain caveat: this line-grain latent→stated crossing sits INSIDE a poem-grain SURVIVAL verdict (transitions, all five seats). The source STATES sound elsewhere in the poem — L5 上有弦歌聲 → 歌[釋樂] fires=true — so the whole-poem sound field survives; the exhibit's claim is the line-grain crossing at L10 itself, not the poem verdict.</text>
